<title>Ҳисобот</title>
<style>
:root{color-scheme:light;--page:#f4f4f1;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--border:rgba(11,11,11,.12);--accent:#2a78d6;--err:#d03b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--border:rgba(255,255,255,.12);--accent:#3987e5;--err:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--border:rgba(255,255,255,.12);--accent:#3987e5;--err:#e66767}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px 22px}
.logo{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 12px}
h1{font-size:20px;text-align:center;margin:0 0 4px}
p{color:var(--ink2);text-align:center;margin:0 0 18px;font-size:14px}
input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--page);color:var(--ink);font:inherit}
label{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:14px;margin:12px 0 16px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600}
.err{color:var(--err);font-size:14px;text-align:center;min-height:20px;margin-top:10px}
.wait{color:var(--muted);text-align:center}
</style>
</head>

  </form>
</div>

const UPD = "27.11.2026 02:59";
document.getElementById('upd').textContent = 'Янгиланган: ' + UPD;
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(P.salt), iterations:P.iter, hash:'SHA-256'},
                                            km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(P.iv)}, key, b(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function tryOpen(pw, remember){
  try {
    await open_(pw);
    try { if (remember) localStorage.setItem('hp', pw); } catch(e) {}
    return true;
  } catch(e) { return false; }
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Очилмоқда…';
  const ok = await tryOpen(document.getElementById('pw').value.trim(), document.getElementById('rem').checked);
  if (!ok) { err.textContent = 'Парол нотўғри'; btn.disabled = false; btn.textContent = 'Кириш'; }
};
(async () => {
  let saved = null; try { saved = localStorage.getItem('hp'); } catch(e) {}
  if (saved) {
    document.getElementById('box').innerHTML = '<div class="wait">Очилмоқда…</div>';
    if (!(await tryOpen(saved, true))) { try { localStorage.removeItem('hp'); } catch(e) {} location.reload(); }
  }
})();
